name: Seed on-chain stats

on:
  schedule:
    # Run daily at 10:00 UTC
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      funded:
        description: "Active funded gifts"
        default: "40"
      claimed:
        description: "Claimed gifts"
        default: "40"
      reclaimed:
        description: "Reclaimed gifts"
        default: "20"
      amount:
        description: "USDC per gift"
        default: "0.01"

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run seed script
        env:
          PRIVATE_KEY: ${{ secrets.SEED_PRIVATE_KEY }}
          CONTRACT_ADDRESS: ${{ secrets.CONTRACT_ADDRESS }}
          SEED_RECEIVER: ${{ secrets.SEED_RECEIVER }}
          APP_URL: ${{ secrets.APP_URL }}
          SEED_FUNDED: ${{ github.event.inputs.funded || '40' }}
          SEED_CLAIMED: ${{ github.event.inputs.claimed || '40' }}
          SEED_RECLAIMED: ${{ github.event.inputs.reclaimed || '20' }}
          SEED_AMOUNT: ${{ github.event.inputs.amount || '0.01' }}
        run: node scripts/seed-stats.mjs
